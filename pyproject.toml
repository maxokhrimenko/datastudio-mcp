[project]
name = "datastudio-mcp"
version = "0.6.10"
description = "MCP for Google Datastudio by Max Omen: AI agents build and edit Datastudio reports end to end"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Max Omen" }]
keywords = ["mcp", "datastudio", "looker-studio", "dashboards", "ai-agents", "claude"]
requires-python = "==3.12.*"
dependencies = [
  "fastmcp==4.0.3",
  "playwright==1.62.0",
  "pydantic==2.13.5",
]

[project.urls]
Homepage = "https://github.com/maxokhrimenko/datastudio-mcp"
Issues = "https://github.com/maxokhrimenko/datastudio-mcp/issues"

[project.scripts]
datastudio-mcp = "datastudio_mcp.server:main"

[build-system]
requires = ["uv_build==0.12.1"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
